[package]
name = "leafpdf"
version = "0.1.0"
edition = "2021"
description = "A focused, native Windows PDF reader"
license = "MIT"
repository = "https://github.com/debugrao-coder/leafpdf"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
