name: Windows CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up Rust stable
        run: |
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup component add rustfmt clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare PDFium and synthetic fixtures
        run: |
          python -m pip install -r scripts/requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/download-pdfium.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/generate-fixtures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Build and package
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the packaged reader
        run: python scripts/qa.py
      - name: Upload portable application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LeafPDF-Windows-x64
          path: |
            dist/LeafPDF-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
